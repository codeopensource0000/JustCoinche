name: build

on:
  push:
  pull_request:

# Cancel a superseded run rather than letting two builds of the same branch queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The build compiles with a JDK 25 toolchain (engine/build.gradle.kts).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, test and static analysis
        run: ./gradlew check --no-daemon

      # Separate step: a green build that ran fewer tests than were written
      # must not pass for a success.
      - name: Every declared test must have run
        run: scripts/verify-test-count.sh

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: engine/build/reports/tests/test/
          if-no-files-found: ignore

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: build/reports/detekt/detekt.html
          if-no-files-found: ignore
