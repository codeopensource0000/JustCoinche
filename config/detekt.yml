# Only the rules where this project deliberately differs from detekt's defaults.
# Everything else comes from the bundled default config
# (buildUponDefaultConfig = true), so this file stays short enough to read.

complexity:
  TooManyFunctions:
    # A set type's operations (membership, add, remove, union, intersection,
    # filter, iteration...) are its contract, not a sign of a class doing too
    # much. 15 leaves room for CardSet while still flagging a grab-bag class.
    thresholdInClasses: 15

style:
  MaxLineLength:
    maxLineLength: 120
  MagicNumber:
    # Tests assert concrete card values and scores; naming every one of them
    # would make the expected numbers harder to check against the rules.
    excludes: ['**/test/**']
    # In `SURCOINCHED(3)` the enum entry already names the number.
    ignoreEnums: true

naming:
  FunctionNaming:
    # Test functions are `written as sentences in backticks`, which is the
    # idiomatic Kotlin way to name them.
    excludes: ['**/test/**']
